# prod: http://www.kencochrane.net/
# local /
baseurl = "https://www.kencochrane.com/"
locale = "en-us"
title = "KenCochrane.com"
theme = "hugo-icarus"
# Define the number of posts per site
[pagination]
    pagerSize = 10

[markup.goldmark.renderer]
    # older posts contain raw HTML
    unsafe = true

[services.googleAnalytics]
    ID = "G-91QCV86YC3"

# Enable comments by entering your Disqus shortname
[services.disqus]
    shortname = ""


[permalinks]
    post = "/:year/:month/:day/:slug"


[params]
    # Tell me who you are
    author = "Ken Cochrane"
    bio = "Head of Engineering at Akuity. Author of Kargo in Action (Manning) and Docker Cookbook."
    location = "Maine"
    site_description = ""
    copyright  = "Powered by [Hugo](//gohugo.io). Theme by [PPOffice](https://github.com/ppoffice)."
    avatar = "img/kencochrane.jpeg"

    # Format dates with Go's time formatting
    date_format = "2006-01-02"

# Create custom menu entries by defining a label and a link for
# them. Since you can also link posts, you've the option the
# place the links before or after them.
#
# E.g.: "Home" appears before all linked posts in the menu
# and "Tags" / "Categories" after them.
[[params.menu]]
    before = true
    label  = "Home"
    link   = "/"

[[params.menu]]
    before = false
    label  = "Tags"
    link   = "tags/"

[[params.menu]]
    before = false
    label  = "Categories"
    link   = "categories/"

# Enter a link for the follow button on the left
[params.profile]
    follow_button = "https://github.com/kencochrane"


[params.social]
# Add your social network accounts to the profile section on the left
# by entering your username. The links to your account will be
# create automatically.
    github          = "kencochrane"
    bitbucket       = ""
    jsfiddle        = ""
    codepen         = ""
    foursquare      = ""
    dribbble        = ""
    deviantart      = ""
    behance         = ""
    flickr          = ""
    instagram       = ""
    youtube         = ""
    vimeo           = ""
    vine            = ""
    medium          = ""
    wordpress       = ""
    tumblr          = ""
    xing            = ""
    linkedin        = "kencochrane"
    slideshare      = ""
    stackoverflow   = "356788"
    reddit          = ""
    pinterest       = ""
    googleplus      = ""
    facebook        = ""
    facebook_admin  = ""
    twitter_domain  = ""
    twitter         = "kencochrane"

# Enable and disable widgets for the right sidebar
[params.widgets]
    recent_articles = true
    categories = true
    tags = true
    tag_cloud = true
