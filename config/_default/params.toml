colorScheme = "slate"
defaultAppearance = "light"
autoSwitchAppearance = true  # follow the reader's OS light/dark setting

enableSearch = true
enableCodeCopy = true
disableTextInHeader = false
mainSections = ["post"]

[header]
  layout = "fixed-fill-blur"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 10
  showMoreLink = true
  showMoreLinkDest = "/post/"
  cardView = false

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showHero = true
  heroStyle = "big"
  showBreadcrumbs = false
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showReadingProgress = true
  showTableOfContents = true
  showTaxonomies = true
  showCategories = false
  showTags = true
  showWordCount = false
  showRelatedContent = true
  relatedContentLimit = 3

[list]
  showHero = false
  showSummary = true
  showTableOfContents = false
  groupByYear = true
  cardView = false

[taxonomy]
  showTermCount = true

[term]
  showTableOfContents = false
  groupByYear = true
