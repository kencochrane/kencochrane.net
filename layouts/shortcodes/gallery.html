{{/* Site override: keeps the old Icarus syntax, {{< gallery "/a.jpg" "/b.jpg" >}},
   rendered as a simple responsive grid. */}}
<div class="not-prose grid grid-cols-2 md:grid-cols-3 gap-3 my-6">
  {{- range .Params }}
  <a href="{{ . | relURL }}" target="_blank" rel="noopener">
    <img src="{{ . | relURL }}" alt="" loading="lazy" class="w-full h-40 object-cover rounded-md m-0">
  </a>
  {{- end }}
</div>
